name: onepiece-tcg

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/nachocabrero/onepiece-tcg:latest
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: ${APP_URL:-http://localhost:8091}
      APP_KEY: ${APP_KEY:?Define APP_KEY en el fichero .env (genéralo con deploy.sh)}
      DB_CONNECTION: sqlite
      DB_DATABASE: /var/www/html/database/database.sqlite
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stack
      LOG_LEVEL: warning
    volumes:
      - optcg_db:/var/www/html/database
      - optcg_storage:/var/www/html/storage
    networks:
      - optcg

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8091}:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    depends_on:
      - app
    networks:
      - optcg

volumes:
  optcg_db:
  optcg_storage:

networks:
  optcg:
